[settings]
dotfiles.root = "~/.dotfiles"

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
zprofile = "shims"
zshrc = "activate"

[dotfiles]
"~/.gitignore_global" = { source = "../config/.gitignore_global", mode = "symlink" }
"~/.tmux.conf" = { source = "../config/tmux.conf", mode = "symlink" }
"~/.vimrc" = { source = "../config/vim/vimrc", mode = "symlink" }
"~/.hushlogin" = { source = "../config/zsh/.hushlogin", mode = "symlink" }
"~/.config/bunfig.toml" = { source = "../config/bun/bunfig.toml", mode = "symlink" }
"~/.config/ghostty" = { source = "../config/ghostty", mode = "symlink" }
"~/.config/karabiner" = { source = "../config/karabiner", mode = "symlink" }
"~/.config/home-manager" = { source = "../config/home-manager", mode = "symlink" }
"~/.config/nvim" = { source = "../config/nvim", mode = "symlink" }
"~/.config/nix" = { source = "../config/nix", mode = "symlink" }
"~/.config/wezterm" = { source = "../config/wezterm", mode = "symlink" }
"~/.config/zed" = { source = "../config/zed", mode = "symlink" }
"~/.config/zsh/.p10k.zsh" = { source = "../config/zsh/.p10k.zsh", mode = "symlink" }
"~/.config/zsh/common" = { source = "../config/zsh/common", mode = "symlink" }
"~/.config/zsh/lib" = { source = "../config/zsh/lib", mode = "symlink" }
"~/.config/zsh/plugins" = { source = "../config/zsh/plugins", mode = "symlink" }
"~/.zshrc" = { source = "../config/zsh/.zshrc", mode = "symlink" }
"~/.zprofile" = { source = "../config/zsh/.zprofile", mode = "symlink" }
"~/.config/age/recipient.txt" = { source = "../config/age/recipient.txt", mode = "symlink" }
"~/.config/mise/config.toml" = { source = "config.toml", mode = "symlink" }
"~/.config/mise/miserc.toml" = { source = "miserc.toml", mode = "symlink" }
"~/.config/mise/config.macos.toml" = { source = "config.macos.toml", mode = "symlink" }
"~/.config/mise/config.linux.toml" = { source = "config.linux.toml", mode = "symlink" }

[env]
BUN_INSTALL = "{{ env.HOME }}/.bun"
DENO_HOME = "{{ env.HOME }}/.deno"
PNPM_HOME = "{{ env.HOME }}/.pnpm"
GOPATH = "{{ env.HOME }}/.go"
MODULAR_HOME = "{{ env.HOME }}/.modular"
GHQ_ROOT = "{{ env.HOME }}/Projects"
_ZO_DATA_DIR = "{{ env.HOME }}/.local/share"
OLLAMA_FLASH_ATTENTION = "1"
OLLAMA_CONTEXT_LENGTH = "64000"

[tasks.bootstrap]
description = "Post-bootstrap machine setup"
run = '''
set -euo pipefail

if [[ "$(uname -s)" == "Darwin" ]]; then
  brew bundle install --file "$HOME/.dotfiles/Brewfile"
fi
'''
